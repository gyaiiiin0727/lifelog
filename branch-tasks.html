<title>ブランチ — マインドマップ式タスク管理</title>
<style>
  :root {
    --bg:#F4F6F8;--surface:#FFFFFF;--surface-2:#FAFBFC;--ink:#1B2430;--muted:#66707E;--faint:#939CA9;
    --border:#E4E8EE;--border-strong:#D2D9E2;--accent:#14746B;--accent-soft:#E1F0EE;--danger:#C0392B;--flag:#E0912A;
    --shadow:0 2px 8px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);--shadow-sm:0 1px 2px rgba(16,24,40,.07);--link:#B9C1CC;
    --font:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Noto Sans JP",Meiryo,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#12151A;--surface:#1C2026;--surface-2:#23282F;--ink:#E7EBF0;--muted:#98A2AE;--faint:#69727E;
      --border:#2A313A;--border-strong:#39424D;--accent:#3EA89A;--accent-soft:#17322F;--danger:#E5705F;--flag:#E3A24A;
      --shadow:0 4px 16px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.35);--shadow-sm:0 1px 2px rgba(0,0,0,.35);--link:#414B57;
    }
  }
  :root[data-theme="light"]{--bg:#F4F6F8;--surface:#FFFFFF;--surface-2:#FAFBFC;--ink:#1B2430;--muted:#66707E;--faint:#939CA9;--border:#E4E8EE;--border-strong:#D2D9E2;--accent:#14746B;--accent-soft:#E1F0EE;--danger:#C0392B;--flag:#E0912A;--shadow:0 2px 8px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);--shadow-sm:0 1px 2px rgba(16,24,40,.07);--link:#B9C1CC;}
  :root[data-theme="dark"]{--bg:#12151A;--surface:#1C2026;--surface-2:#23282F;--ink:#E7EBF0;--muted:#98A2AE;--faint:#69727E;--border:#2A313A;--border-strong:#39424D;--accent:#3EA89A;--accent-soft:#17322F;--danger:#E5705F;--flag:#E3A24A;--shadow:0 4px 16px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.35);--shadow-sm:0 1px 2px rgba(0,0,0,.35);--link:#414B57;}

  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; font-family:var(--font); background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100vh; overflow:hidden; }
  button { font-family:inherit; cursor:pointer; }

  .topbar { display:flex; align-items:center; gap:12px; padding:12px clamp(14px,3vw,26px);
    background:var(--surface); border-bottom:1px solid var(--border); z-index:30; flex:none; }
  .brand { display:flex; align-items:center; gap:9px; min-width:0; }
  .brand .mark { width:22px; height:22px; flex:none; }
  .brand h1 { font-size:16.5px; font-weight:700; margin:0; white-space:nowrap; }
  .brand .sub { font-size:12px; color:var(--faint); white-space:nowrap; }
  .spacer { flex:1; }
  .toolbar { display:flex; align-items:center; gap:7px; flex-wrap:wrap; justify-content:flex-end; }

  .seg { display:inline-flex; background:var(--surface-2); border:1px solid var(--border);
    border-radius:999px; padding:3px; gap:2px; }
  .seg button { height:30px; padding:0 14px; border:0; background:transparent; color:var(--muted);
    font-size:13px; font-weight:700; border-radius:999px; display:inline-flex; align-items:center; gap:6px; }
  .seg button[aria-pressed="true"] { background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm); }
  .seg button svg { width:15px; height:15px; }

  .btn { display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 13px; border-radius:999px;
    border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); font-size:13px;
    font-weight:600; white-space:nowrap; transition:background .14s,border-color .14s,transform .05s; }
  .btn:hover { background:var(--surface-2); border-color:var(--faint); }
  .btn:active { transform:translateY(1px); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover { filter:brightness(1.07); background:var(--accent); }
  .btn.icon { width:34px; padding:0; justify-content:center; }
  .btn svg { width:15px; height:15px; }

  .help { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:8px clamp(14px,3vw,26px);
    background:var(--surface-2); border-bottom:1px solid var(--border); font-size:12.5px; color:var(--muted); flex:none; }
  .help .k { display:inline-flex; align-items:center; gap:5px; }
  kbd { font-family:var(--font); font-size:11px; font-weight:700; color:var(--ink); background:var(--surface);
    border:1px solid var(--border-strong); border-bottom-width:2px; border-radius:6px; padding:1px 6px; min-width:20px; text-align:center; }
  .help .close { margin-left:auto; border:0; background:transparent; color:var(--faint); width:26px; height:26px;
    border-radius:6px; font-size:16px; display:inline-flex; align-items:center; justify-content:center; }
  .help .close:hover { background:var(--surface); color:var(--ink); }
  .help.hidden { display:none; }

  .theme-bar { display:flex; align-items:center; gap:7px; flex-wrap:wrap; padding:8px clamp(14px,3vw,26px);
    background:var(--surface); border-bottom:1px solid var(--border); flex:none; }
  .theme-bar[hidden] { display:none; }
  .theme-bar .tb-label { font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--faint); margin-right:2px; }
  .theme-chip { height:30px; padding:0 13px; border:1px solid var(--border-strong); background:var(--surface-2);
    color:var(--muted); border-radius:999px; font-size:13px; font-weight:700; max-width:200px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .theme-chip:hover { background:var(--surface); color:var(--ink); }
  .theme-chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .theme-add { height:30px; padding:0 12px; border:1px dashed var(--border-strong); background:transparent;
    color:var(--muted); border-radius:999px; font-size:12.5px; font-weight:700; display:inline-flex; align-items:center; gap:5px; }
  .theme-add:hover { border-color:var(--accent); color:var(--accent); }
  .theme-add svg { width:13px; height:13px; }
  .theme-del { width:30px; height:30px; border:1px solid var(--border-strong); background:var(--surface); color:var(--faint);
    border-radius:999px; display:inline-flex; align-items:center; justify-content:center; margin-left:auto; }
  .theme-del:hover { color:var(--danger); border-color:var(--danger); }
  .theme-del svg { width:14px; height:14px; }

  .views { flex:1; position:relative; overflow:hidden; display:flex; }

  /* ---- Map ---- */
  .stage { position:relative; flex:1; overflow:auto; cursor:grab;
    background:radial-gradient(circle at 1px 1px, color-mix(in srgb,var(--faint) 26%, transparent) 1px, transparent 0);
    background-size:26px 26px; }
  .stage.panning { cursor:grabbing; }
  .zoom-ctl { position:absolute; right:16px; bottom:16px; z-index:20; display:flex; align-items:center;
    background:var(--surface); border:1px solid var(--border-strong); border-radius:999px; box-shadow:var(--shadow); overflow:hidden; }
  .zoom-ctl button { border:0; background:transparent; color:var(--ink); height:36px; min-width:40px; font-size:16px; font-weight:700; padding:0 6px; }
  .zoom-ctl button:hover { background:var(--surface-2); }
  .zoom-ctl #zoom-reset { min-width:56px; font-size:12.5px; border-left:1px solid var(--border); border-right:1px solid var(--border); font-variant-numeric:tabular-nums; }
  .stage::-webkit-scrollbar { width:12px; height:12px; }
  .stage::-webkit-scrollbar-thumb { background:var(--border-strong); border-radius:12px; border:3px solid transparent; background-clip:padding-box; }
  .canvas { position:relative; min-width:100%; min-height:100%; }
  #links { position:absolute; top:0; left:0; pointer-events:none; z-index:0; overflow:visible; }
  #nodes { position:absolute; top:0; left:0; z-index:1; }
  #stickies { position:absolute; top:0; left:0; z-index:2; }
  .sticky { position:absolute; width:180px; background:var(--sc,#FFE08A); border-radius:4px;
    box-shadow:0 4px 12px rgba(0,0,0,.18); transform:rotate(-1deg); }
  .sticky.dragging { z-index:25; box-shadow:0 12px 26px rgba(0,0,0,.3); transform:rotate(0deg) scale(1.02); }
  .sticky.min { width:auto; min-width:118px; max-width:220px; }
  .sticky.min .sticky-bar { height:26px; }
  .sticky-bar { display:flex; align-items:center; gap:3px; height:20px; padding:0 4px 0 6px; cursor:grab; touch-action:none; }
  .sticky-bar:active { cursor:grabbing; }
  .sticky-spacer { flex:1; }
  .sticky-title { flex:1; min-width:0; font-size:12px; font-weight:700; color:#3a3218; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sticky-grip { color:rgba(0,0,0,.32); display:inline-flex; flex:none; }
  .sticky-grip svg { width:13px; height:13px; }
  .sticky-min { border:0; background:transparent; color:rgba(0,0,0,.36); width:18px; height:18px; border-radius:4px; display:inline-flex; align-items:center; justify-content:center; flex:none; }
  .sticky-min svg { width:12px; height:12px; }
  .sticky-min:hover { color:rgba(0,0,0,.7); background:rgba(0,0,0,.09); }
  .sticky-del { border:0; background:transparent; color:rgba(0,0,0,.34); width:18px; height:18px; border-radius:4px; display:inline-flex; align-items:center; justify-content:center; }
  .sticky-del svg { width:12px; height:12px; }
  .sticky-del:hover { color:#b00; background:rgba(0,0,0,.09); }
  .sticky-text { width:100%; border:0; background:transparent; resize:none; outline:none; font-family:inherit;
    font-size:13px; line-height:1.55; color:#3a3218; padding:1px 11px 12px; overflow:hidden; }
  .sticky-text::placeholder { color:rgba(0,0,0,.36); }

  .node { position:absolute; z-index:1; }
  .node.dragging { z-index:30; opacity:.9; }
  .node-row { display:flex; align-items:flex-start; gap:8px; background:var(--surface); border:1px solid var(--border);
    border-left:3px solid var(--col,var(--accent)); border-radius:11px; padding:8px 11px; box-shadow:var(--shadow-sm);
    transition:box-shadow .12s,border-color .12s; }
  .node:hover .node-row { border-color:color-mix(in srgb,var(--col) 45%, var(--border)); }
  .node.selected .node-row { border-color:var(--col); box-shadow:0 0 0 2px color-mix(in srgb,var(--col) 30%, transparent), var(--shadow); }
  .node.drop-target .node-row { border-color:var(--col); box-shadow:0 0 0 3px color-mix(in srgb,var(--col) 45%, transparent), var(--shadow); background:color-mix(in srgb,var(--col) 10%, var(--surface)); }

  .node.root .node-row { background:var(--accent); border:none; border-radius:999px; padding:10px 18px; justify-content:center; box-shadow:var(--shadow); }
  .node.root .node-text { color:#fff; font-weight:700; text-align:center; }
  .node.root.selected .node-row { box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%, transparent), var(--shadow); }
  /* 大分類（第1階層） */
  .node.branch .node-row { border-left-width:5px; padding:10px 13px; background:color-mix(in srgb,var(--col) 6%, var(--surface)); }
  .node.branch .node-text { font-weight:800; font-size:15.5px; letter-spacing:.01em; }
  .branch-dot { flex:none; width:12px; height:12px; margin-top:4px; border-radius:50%; background:var(--col); box-shadow:0 0 0 4px color-mix(in srgb,var(--col) 20%, transparent); }

  /* 中分類（グループ）＝「色バッジ＋太い帯」の見出しスタイル（塗りつぶさない） */
  .node.group:not(.branch) .node-row { border-left-width:6px; padding:9px 12px;
    background:var(--surface); border-color:color-mix(in srgb,var(--col) 22%, var(--border)); }
  .node.group:not(.branch) .node-text { font-weight:800; font-size:14.5px; letter-spacing:.01em;
    color:color-mix(in srgb,var(--col) 45%, var(--ink)); }
  .node.group:not(.branch) .node-icon { color:#fff; background:var(--col); border-radius:6px; width:22px; height:22px;
    box-shadow:0 1px 4px color-mix(in srgb,var(--col) 38%, transparent); }
  .node.group:not(.branch) .node-icon svg { width:13px; height:13px; }
  .node.group:not(.branch):hover .node-row { border-color:color-mix(in srgb,var(--col) 40%, var(--border)); background:color-mix(in srgb,var(--col) 5%, var(--surface)); }

  /* メモ・目標＝「色で塗ったハイライト・カード」（中分類とは別の性格に） */
  .node.memo .node-row { background:color-mix(in srgb,var(--col) 16%, var(--surface)); border:1px solid color-mix(in srgb,var(--col) 42%, var(--border)); border-left:4px solid var(--col); border-radius:14px; box-shadow:0 2px 12px color-mix(in srgb,var(--col) 22%, transparent); }
  .node.memo .node-text { color:color-mix(in srgb,var(--col) 30%, var(--ink)); font-weight:800; }
  .node.memo .memo-ico { color:var(--col); }
  .node.memo .memo-ico svg { width:17px; height:17px; }

  /* タスク（第3階層以降）はやや控えめ */
  .node.task .node-text { font-size:13.5px; }

  /* 思考マップのアイデア・ノード（普通のマインドマップ） */
  .node.idea:not(.branch) .node-row { border-left-width:3px; background:color-mix(in srgb,var(--col) 5%, var(--surface)); }
  .node.idea:not(.branch) .node-text { font-weight:600; font-size:13.5px; }
  .idea-dot { flex:none; width:9px; height:9px; margin-top:5px; border-radius:50%; background:var(--col); }

  .node-check { flex:none; width:19px; height:19px; margin-top:1px; border-radius:6px; border:1.8px solid var(--border-strong);
    background:var(--surface); display:inline-flex; align-items:center; justify-content:center; color:#fff; transition:background .12s,border-color .12s; }
  .node-check svg { width:12px; height:12px; opacity:0; }
  .node.done .node-check { background:var(--col); border-color:var(--col); }
  .node.done .node-check svg { opacity:1; }
  .node-icon { flex:none; width:19px; height:19px; margin-top:1px; display:inline-flex; align-items:center; justify-content:center; color:var(--col); }
  .node-icon svg { width:15px; height:15px; }

  .node-text { flex:1 1 auto; min-width:60px; border:0; background:transparent; resize:none; color:var(--ink);
    font-family:inherit; font-size:14px; line-height:1.5; padding:0; overflow:hidden; outline:none; }
  .node.done .node-text { text-decoration:line-through; text-decoration-color:color-mix(in srgb,var(--faint) 70%,transparent); color:var(--faint); }
  .node-text::placeholder { color:var(--faint); }

  .node-meta { display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin:4px 0 0 27px; }
  .meta-flag { color:var(--flag); display:inline-flex; }
  .meta-flag svg { width:13px; height:13px; fill:var(--flag); }
  .chip { font-size:10.5px; font-weight:700; border-radius:999px; padding:1px 7px; white-space:nowrap; }
  .cadence-chip { color:color-mix(in srgb,var(--col) 62%,var(--ink)); background:color-mix(in srgb,var(--col) 15%,transparent); }
  .node.done .cadence-chip { color:var(--faint); background:color-mix(in srgb,var(--faint) 14%,transparent); }
  .count-chip { color:var(--muted); background:var(--surface-2); border:1px solid var(--border); }
  .due-chip { color:var(--muted); background:var(--surface-2); border:1px solid var(--border); }
  .due-chip.today { color:#fff; background:var(--accent); border-color:var(--accent); }
  .due-chip.overdue { color:#fff; background:var(--danger); border-color:var(--danger); }
  .link-chip { display:inline-flex; align-items:center; gap:3px; text-decoration:none; cursor:pointer;
    color:color-mix(in srgb,var(--accent) 70%,var(--ink)); background:color-mix(in srgb,var(--accent) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 32%,transparent); }
  .link-chip:hover { background:color-mix(in srgb,var(--accent) 22%,transparent); }
  .link-chip svg { width:11px; height:11px; }
  .node-tools .lnk.on { color:var(--accent); }
  .link-menu { display:flex; flex-direction:column; gap:9px; min-width:230px; }
  .link-input { height:38px; border:1px solid var(--border-strong); border-radius:9px; background:var(--surface-2);
    color:var(--ink); font-family:inherit; font-size:13.5px; padding:0 11px; }
  .link-input:focus { outline:none; border-color:var(--accent); background:var(--surface); }
  .link-btns { display:flex; gap:7px; }
  .link-btns .link-save { flex:1; height:34px; border:0; border-radius:9px; background:var(--accent); color:#fff; font-weight:800; font-size:12.5px; }
  .link-btns .link-open { height:34px; padding:0 13px; display:inline-flex; align-items:center; border:1px solid var(--border-strong);
    border-radius:9px; color:var(--ink); text-decoration:none; font-weight:700; font-size:12.5px; }
  .link-btns .link-open:hover { background:var(--surface-2); }
  .link-btns .link-clear { height:34px; padding:0 11px; border:1px solid var(--border-strong); background:var(--surface); color:var(--faint); border-radius:9px; font-size:12.5px; font-weight:700; }
  .link-btns .link-clear:hover { color:var(--danger); border-color:var(--danger); }

  .node-collapse { position:absolute; right:-12px; top:50%; transform:translateY(-50%); width:22px; height:22px;
    border-radius:50%; border:1px solid var(--border-strong); background:var(--surface); color:var(--muted); font-size:11px;
    display:flex; align-items:center; justify-content:center; z-index:3; box-shadow:var(--shadow-sm); }
  .node-collapse:hover { color:var(--ink); border-color:var(--faint); }
  .node-collapse svg { width:12px; height:12px; transition:transform .18s; }
  .node-collapse.closed svg { transform:rotate(-90deg); }

  .node-grip { position:absolute; left:-11px; top:50%; transform:translateY(-50%); width:20px; height:24px;
    border-radius:6px; background:var(--surface); border:1px solid var(--border-strong); color:var(--faint);
    display:flex; align-items:center; justify-content:center; cursor:grab; z-index:5; touch-action:none;
    box-shadow:var(--shadow-sm); opacity:.35; transition:opacity .12s; }
  .node:hover .node-grip, .node.selected .node-grip { opacity:1; }
  .node.dragging .node-grip { opacity:1; }
  .node-grip:active { cursor:grabbing; }
  .node-grip svg { width:12px; height:12px; }

  .node-tools { position:absolute; top:-15px; right:8px; display:none; gap:1px; background:var(--surface);
    border:1px solid var(--border-strong); border-radius:9px; padding:2px; box-shadow:var(--shadow); z-index:6; }
  .node:hover .node-tools, .node.selected .node-tools { display:flex; }
  .node-tools button { width:26px; height:26px; border:0; background:transparent; border-radius:6px; color:var(--muted);
    display:inline-flex; align-items:center; justify-content:center; }
  .node-tools button svg { width:14px; height:14px; }
  .node-tools button:hover { background:var(--surface-2); color:var(--ink); }
  .node-tools button.on { color:var(--flag); }
  .node-tools button.on svg { fill:var(--flag); }
  .node-tools button.rep.on { color:var(--col); }
  .node-tools button.due.on { color:var(--accent); }
  .node-tools button.del:hover { color:var(--danger); background:color-mix(in srgb,var(--danger) 12%,transparent); }

  .root-hint { position:absolute; font-size:13px; color:var(--muted); background:var(--surface); border:1px dashed var(--border-strong);
    border-radius:10px; padding:8px 12px; box-shadow:var(--shadow-sm); display:flex; align-items:center; gap:6px; white-space:nowrap; }

  /* ---- Dashboard ---- */
  .dash { flex:1; overflow:auto; display:none; }
  .dash-inner { max-width:920px; margin:0 auto; padding:clamp(18px,3vw,34px) clamp(16px,3vw,28px) 60px; }
  .dash-date { font-size:13px; color:var(--faint); font-weight:600; margin-bottom:3px; }
  .dash-title { font-size:22px; font-weight:800; margin:0 0 18px; letter-spacing:.01em; }
  .stat-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:26px; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow-sm); }
  .stat .num { font-size:26px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .stat .lbl { font-size:12px; color:var(--muted); margin-top:6px; font-weight:600; }
  .stat.accent .num { color:var(--accent); }
  .stat.danger .num { color:var(--danger); }
  .stat.flag .num { color:var(--flag); }

  .dash-section { margin-bottom:22px; }
  .dash-h { display:flex; align-items:center; gap:9px; margin:0 0 10px; }
  .dash-h .dot { width:9px; height:9px; border-radius:50%; }
  .dash-h h3 { font-size:15px; font-weight:800; margin:0; }
  .dash-h .cnt { font-size:12px; color:var(--faint); font-weight:700; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:1px 8px; }
  .dash-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); overflow:hidden; }
  .dash-section.overdue .dash-card { border-color:color-mix(in srgb,var(--danger) 40%, var(--border)); }
  .dash-task { display:flex; align-items:flex-start; gap:11px; padding:12px 15px; border-top:1px solid var(--border); cursor:pointer; transition:background .1s; }
  .dash-task:first-child { border-top:0; }
  .dash-task:hover { background:var(--surface-2); }
  .dash-check { flex:none; width:20px; height:20px; margin-top:1px; border-radius:6px; border:1.8px solid var(--border-strong);

  /* Popover */

<script>
(function () {
  "use strict";

  const KEY="branch.mindmap.v1", OLD_KEY="branch.mindtask.v1";
  const PALETTE=["#E4572E","#E0912A","#2A9D8F","#4C6EF5","#9B5DE5","#43AA8B","#E5679A","#577590"];
  const REPEAT_ORDER=[null,"daily","weekly","monthly"];
  const REPEAT_LABEL={daily:"毎日",weekly:"毎週",monthly:"毎月"};
  const WD=["日","月","火","水","木","金","土"];
  const ROOT_W=150, NODE_W=216, H_GAP=56, V_GAP=13, PAD=60, VINDENT=34;

  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

  // ---- dates ----
  function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function parseYmd(s){ const p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
  function todayStr(){ return ymd(new Date()); }
  function tomorrowStr(){ const d=new Date(); d.setDate(d.getDate()+1); return ymd(d); }
  function weekStart(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setHours(0,0,0,0); x.setDate(x.getDate()-day); return x; }
  function weekEndStr(){ const s=weekStart(new Date()); s.setDate(s.getDate()+6); return ymd(s); }
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
  function sameMonth(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth(); }

  function isDone(n){
    if(!n.repeat) return !!n.done;
    if(!n.lastDone) return false;
    const l=new Date(n.lastDone), now=new Date();
    if(n.repeat==="daily") return sameDay(l,now);
    if(n.repeat==="weekly") return weekStart(l).getTime()===weekStart(now).getTime();
    if(n.repeat==="monthly") return sameMonth(l,now);
    return false;
  }
  function nthWeekday(y,m,weekday,n){ const first=new Date(y,m,1); const fd=first.getDay();
    let day=1+((weekday-fd+7)%7)+(n-1)*7; const dim=new Date(y,m+1,0).getDate(); while(day>dim) day-=7; return new Date(y,m,day); }
  function wdays(n){ return Array.isArray(n.weekdays)?n.weekdays:[]; }
  // 今日を含め7日以内で、選択曜日に一致する最も近い日付
  function nextWeekdayDate(weekdays){ const now=new Date(); now.setHours(0,0,0,0); const wd=now.getDay();
    for(let i=0;i<7;i++){ if(weekdays.includes((wd+i)%7)){ const d=new Date(now); d.setDate(now.getDate()+i); return d; } } return null; }
  // Concrete scheduled date for a recurring task in the current period (or null = whole-period).
  function recurDate(n){ const now=new Date(), y=now.getFullYear(), m=now.getMonth(); const wds=wdays(n);
    if(n.repeat==="daily") return new Date(y,m,now.getDate());
    if(n.repeat==="weekly"){ if(!wds.length) return null; return nextWeekdayDate(wds); }
    if(n.repeat==="monthly"){
      if(wds.length&&n.weekOfMonth!=null){ let best=null; wds.forEach(w=>{ const d=nthWeekday(y,m,w,n.weekOfMonth); if(!best||d<best) best=d; }); return best; }
      if(n.weekOfMonth!=null){ const dim=new Date(y,m+1,0).getDate(); return new Date(y,m,Math.min(dim,(n.weekOfMonth-1)*7+4)); }
      if(wds.length){ let best=null; wds.forEach(w=>{ const d=nthWeekday(y,m,w,1); if(!best||d<best) best=d; }); return best; }
      return null;
    }
    return null;
  }
  function repeatLabel(n){ const wds=wdays(n); const wl=wds.map(w=>WD[w]).join("・");
    if(n.repeat==="daily") return "毎日";
    if(n.repeat==="weekly") return wds.length?("毎週"+wl):"毎週";
    if(n.repeat==="monthly"){
      if(n.weekOfMonth!=null&&wds.length) return "毎月第"+n.weekOfMonth+" "+wl;
      if(n.weekOfMonth!=null) return "毎月第"+n.weekOfMonth+"週";
      if(wds.length) return "毎月"+wl;
      return "毎月";
    }
    return "";
  }
  function dueLabel(due){
    if(!due) return null;
    const t=todayStr();
    if(due<t){ const d=parseYmd(due); return {text:(d.getMonth()+1)+"/"+d.getDate(), cls:"overdue"}; }
    if(due===t) return {text:"今日", cls:"today"};
    if(due===tomorrowStr()) return {text:"明日", cls:""};

    below.forEach(k=>{ place(k,bx,cur); cur+=k._sub+V_GAP; });
  }
  function relayout(){
    if(view!=="map"&&view!=="think") return;
    els.forEach((el)=>{ const ta=el.querySelector(".node-text"); if(ta) autoGrow(ta); el.__node._h=el.offsetHeight; });
    calcSub(curRoot); place(curRoot,PAD,PAD);
    applyOffsets(curRoot); // ノードごとの自由配置（枝ごと移動）を反映
    // 周囲に余白を確保（＝いつでも空きを掴んで画面を動かせる）。左枝の負座標もここで吸収。
    const vw=stage.clientWidth||900, vh=stage.clientHeight||600;
    const mX=Math.max(PAD,Math.round(vw*0.55)), mY=Math.max(PAD,Math.round(vh*0.55));
    let minX=Infinity,minY=Infinity;
    els.forEach((el)=>{ const n=el.__node; minX=Math.min(minX,n._x); minY=Math.min(minY,n._y-n._h/2); });
    const dx=mX-minX, dy=mY-minY;
    let maxR=0,maxB=0;
    els.forEach((el)=>{ const n=el.__node; n._x+=dx; n._y+=dy; el.style.left=n._x+"px"; el.style.top=(n._y-n._h/2)+"px";
      maxR=Math.max(maxR,n._x+nodeWidth(n._depth)); maxB=Math.max(maxB,n._y+n._h/2); });
    const rh=$("#root-hint");
    if(rh){ rh.style.left=(curRoot._x+ROOT_W+40)+"px"; rh.style.top=(curRoot._y-18)+"px"; maxR=Math.max(maxR,curRoot._x+ROOT_W+340); }
    if(!isThink()) state.stickies.forEach(s=>{ maxR=Math.max(maxR,(s.x||0)+200); maxB=Math.max(maxB,(s.y||0)+160); });
    const W=maxR+mX, H=maxB+mY;
    canvas.style.width=W+"px"; canvas.style.height=H+"px";
    drawLinks(W,H);
    if(needCenter){ needCenter=false; stage.scrollLeft=Math.max(0,curRoot._x*zoom-vw*0.28); stage.scrollTop=Math.max(0,curRoot._y*zoom-vh/2); }
  }
  function drawLinks(W,H){
    let d="";
    (function walk(node){
      if(node.collapsed) return;
      const vert=vertParent(node);
      node.children.forEach(ch=>{
        const col=(typeof ch._col==="string"&&ch._col.indexOf("var")===0)?(getComputedStyle(document.documentElement).getPropertyValue("--link").trim()||"#B9C1CC"):ch._col;
        let path;
        if(vert||ch.below){
          const sx=node._x+18, sy=node._y+node._h/2, ex=ch._x, ey=ch._y;
          const r=Math.max(0,Math.min(8,Math.abs(ex-sx)/2,Math.abs(ey-sy)/2));
          path=`M ${sx} ${sy} V ${ey-r} Q ${sx} ${ey} ${sx+r} ${ey} H ${ex}`;
        } else {
          const leftSide=ch._x<node._x;
          const sx=leftSide?node._x:(node._x+nodeWidth(node._depth));
          const ex=leftSide?(ch._x+nodeWidth(ch._depth)):ch._x;
          const sy=node._y, ey=ch._y, dy=ey-sy;
          if(Math.abs(dy)<0.5){ path=`M ${sx} ${sy} H ${ex}`; }
          else { const midx=(sx+ex)/2, s=dy>0?1:-1, r=Math.max(0,Math.min(9,Math.abs(ex-sx)/2,Math.abs(dy)/2));
            path=`M ${sx} ${sy} H ${midx-r} Q ${midx} ${sy} ${midx} ${sy+s*r} V ${ey-s*r} Q ${midx} ${ey} ${midx+r} ${ey} H ${ex}`; }
        }
        d+=`<path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>`;
        walk(ch);
      });
    })(curRoot);
    links.setAttribute("width",W); links.setAttribute("height",H); links.innerHTML=d;
  }

  // ---- focus / selection ----
  function selectNode(id){ if(selectedId&&els.has(selectedId)) els.get(selectedId).classList.remove("selected"); selectedId=id; if(els.has(id)) els.get(id).classList.add("selected"); }
  // 見た目の位置で上下左右の一番近いノードへ移動
  function navDir(id,dir){
    const cur=(locate(id)||{}).node; if(!cur) return false;
    const cx=cur._x+nodeWidth(cur._depth)/2, cy=cur._y;
    let best=null, bestScore=Infinity;
    els.forEach((el)=>{ const n=el.__node; if(!n||n===cur) return;
      const nx=n._x+nodeWidth(n._depth)/2, ny=n._y, dx=nx-cx, dy=ny-cy;
      let along,perp,ok=false;
      if(dir==="right"){ ok=dx>6&&Math.abs(dy)<=Math.abs(dx)*1.4; along=dx; perp=Math.abs(dy); }
      else if(dir==="left"){ ok=dx<-6&&Math.abs(dy)<=Math.abs(dx)*1.4; along=-dx; perp=Math.abs(dy); }
      else if(dir==="down"){ ok=dy>6&&Math.abs(dx)<=Math.abs(dy)*1.4; along=dy; perp=Math.abs(dx); }
      else { ok=dy<-6&&Math.abs(dx)<=Math.abs(dy)*1.4; along=-dy; perp=Math.abs(dx); }
      if(!ok) return; const score=along+perp*2.2;
      if(score<bestScore){ bestScore=score; best=n; }
    });
    if(best){ focusNode(best.id); return true; } return false;
  }
  function focusNode(id){ const el=els.get(id); if(!el) return; selectNode(id); const ta=el.querySelector(".node-text");
    if(ta){ ta.focus(); const v=ta.value; try{ ta.setSelectionRange(v.length,v.length); }catch(e){} } el.scrollIntoView({block:"nearest",inline:"nearest"}); }

  // ---- structural ops ----
  function defType(isTop){ return isThink()?"idea":(isTop?"group":"task"); }
  function addSiblingAfter(id){ const loc=locate(id); if(!loc) return; if(!loc.parent){ addBranch(); return; }
    const top=(loc.parent===curRoot); const sib=newNode("",defType(top));
    sib.below=loc.node.below; // 真下ノードの兄弟は真下に、横ノードの兄弟は横に
    const idx=loc.parent.children.indexOf(loc.node); if(top){ sib.color=pickColor(); if(loc.node.side) sib.side=loc.node.side; }
    loc.parent.children.splice(idx+1,0,sib); pendingFocus=sib.id; save(); render(); }
  function addChild(id){ const loc=locate(id); if(!loc) return; const top=(loc.node===curRoot); const child=newNode("",defType(top)); if(top) child.color=pickColor();
    loc.node.collapsed=false; loc.node.children.push(child); pendingFocus=child.id; save(); render(); }
  function addChildBelow(id){ const loc=locate(id); if(!loc) return; const top=(loc.node===curRoot); const child=newNode("",defType(top)); child.below=true; if(top) child.color=pickColor();
    loc.node.collapsed=false; loc.node.children.push(child); pendingFocus=child.id; save(); render(); }
  function addBranch(side){ if(view!=="map"&&view!=="think") setView("map"); const b=newNode("",isThink()?"idea":"group"); if(side==="left") b.side="left"; b.color=pickColor(); curRoot.collapsed=false; curRoot.children.push(b); pendingFocus=b.id; save(); render(); }
  function outdent(id){ const loc=locate(id); if(!loc||!loc.parent) return; const gpLoc=locate(loc.parent.id); if(!gpLoc||!gpLoc.parent) return;
    const gp=gpLoc.parent; const idx=loc.parent.children.indexOf(loc.node); loc.parent.children.splice(idx,1);
    const pIdx=gp.children.indexOf(loc.parent); gp.children.splice(pIdx+1,0,loc.node);
    if(gp===curRoot){ if(!loc.node.color) loc.node.color=pickColor(); loc.node.type=isThink()?"idea":"group"; } pendingFocus=id; save(); render(); }
  function deleteNode(id){ const loc=locate(id); if(!loc||!loc.parent) return;
    if(loc.node.children.length){ if(!confirm("この枝と、ぶら下がっている中身をすべて削除しますか？")) return; }
    const idx=loc.parent.children.indexOf(loc.node); loc.parent.children.splice(idx,1);
    const focusTo=idx>0?loc.parent.children[idx-1]:loc.parent; pendingFocus=focusTo.id; save(); render(); }
  function reparent(dragId,targetId){
    const dloc=locate(dragId), tloc=locate(targetId);
    if(!dloc||!tloc||!dloc.parent) return; if(dragId===targetId) return; if(within(dloc.node,targetId)) return;
    const idx=dloc.parent.children.indexOf(dloc.node); dloc.parent.children.splice(idx,1);
    dloc.node.ox=0; dloc.node.oy=0; // 付け替え時は自由配置を解除して整列
    tloc.node.collapsed=false; tloc.node.children.push(dloc.node);
    if(tloc.node===curRoot){ if(!dloc.node.color) dloc.node.color=pickColor(); dloc.node.type=isThink()?"idea":"group"; }
    selectNode(dragId); save(); render(); toast("移動しました");
  }
  function applyToggle(node){ if(node.repeat){ node.lastDone=isDone(node)?null:Date.now(); } else node.done=!node.done; }
  function cycleRepeat(node){ const i=REPEAT_ORDER.indexOf(node.repeat||null); node.repeat=REPEAT_ORDER[(i+1)%REPEAT_ORDER.length];
    if(node.repeat){ node.lastDone=node.done?Date.now():null; node.done=false; } else node.lastDone=null; }

  // ---- map click ----

      if(a==="flag"){ node.priority=!node.priority; save(); render(); }
      else if(a==="repeat"){ openRepeatMenu(node,act); }
      else if(a==="type"){ openTypeMenu(node,act); }
      else if(a==="due"){ openDueMenu(node,act); }
      else if(a==="link"){ openLinkMenu(node,act); }
      else if(a==="add"){ addChild(id); }

  });

    const {node}=locate(ta.closest(".node").dataset.id)||{}; if(!node) return; node.text=ta.value; autoGrow(ta); relayout(); saveDebounced(); });
  nodesLayer.addEventListener("focusin",(e)=>{ const ta=e.target.closest(".node-text"); if(ta) selectNode(ta.closest(".node").dataset.id); });
  nodesLayer.addEventListener("change",(e)=>{ if(e.target.closest(".node-text")){ save(); if(isThink()) renderThemeBar(); } });

  nodesLayer.addEventListener("keydown",(e)=>{
    const ta=e.target.closest(".node-text"); if(!ta) return;
    if(e.isComposing||e.keyCode===229) return; // IME変換中のEnter等は確定に使わせる（ノードを作らない）
    const id=ta.closest(".node").dataset.id; const mod=e.metaKey||e.ctrlKey;
    if(e.key==="Enter"&&mod){ e.preventDefault(); addChildBelow(id); return; }
    if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); addSiblingAfter(id); return; }
    if(e.key==="Tab"&&!e.shiftKey){ e.preventDefault(); addChild(id); return; }
    if(e.key==="Tab"&&e.shiftKey){ e.preventDefault(); outdent(id); return; }
    if(e.key==="Backspace"&&ta.value===""){ e.preventDefault(); deleteNode(id); return; }
    const atStart=ta.selectionStart===0&&ta.selectionEnd===0;
    const atEnd=ta.selectionStart===ta.value.length&&ta.selectionEnd===ta.value.length;
    if(e.key==="ArrowDown"&&atEnd){ if(navDir(id,"down")) e.preventDefault(); return; }
    if(e.key==="ArrowUp"&&atStart){ if(navDir(id,"up")) e.preventDefault(); return; }
    if(e.key==="ArrowRight"&&atEnd){ if(navDir(id,"right")) e.preventDefault(); return; }
    if(e.key==="ArrowLeft"&&atStart){ if(navDir(id,"left")) e.preventDefault(); return; }
  });

  // ---- drag to reparent（ノード本体 or ⠿ をつかんで移動）----
  let drag=null;

  nodesLayer.addEventListener("pointerdown",(e)=>{
    if(e.pointerType==="mouse"&&e.button!==0) return;

    if(nodeDiv.classList.contains("root")) return; // 中心は動かさない
    // 編集・操作パーツからはドラッグ開始しない（文字入力/チェック/開閉/ツールバー）
    if(e.target.closest(".node-text")||e.target.closest('[data-role="check"]')||e.target.closest('[data-role="collapse"]')||e.target.closest('[data-role="link"]')||e.target.closest(".node-tools")) return;
    const id=nodeDiv.dataset.id; const el=els.get(id); if(!el) return;
    drag={id,el,sx:e.clientX,sy:e.clientY,started:false,target:null};
  });
  window.addEventListener("pointermove",(e)=>{
    if(!drag) return;

      if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)<5) return;
      drag.started=true; selectNode(drag.id);
      drag.el.classList.add("dragging"); drag.el.style.pointerEvents="none"; document.body.style.userSelect="none";
    }
    drag.lx=e.clientX; drag.ly=e.clientY;
    drag.el.style.transform=`translate(${(e.clientX-drag.sx)/zoom}px, ${(e.clientY-drag.sy)/zoom}px)`;
    const under=document.elementFromPoint(e.clientX,e.clientY); const tn=under&&under.closest(".node");

    if(!drag) return;

      if(t){ reparent(drag.id,t); }

    }

  });

  // ---- popovers ----

  // ---- dashboard ----
  function collectTasks(){ const out=[]; (function walk(node,depth,branch,path){
    for(const k of node.children){ const kd=depth+1; const kb=kd===1?k:branch;
      if(kd>=2&&k.type==="task") out.push({node:k,branch:kb,path:path});
      walk(k,kd,kb,kd>=1?path.concat(k.text||"（無題）"):path);
    } })(state.root,0,null,[]); return out; }
  function bucketOf(t){ const n=t.node; const today=todayStr();
    if(n.due){ if(n.due<today) return isDone(n)?"today":"overdue"; if(n.due===today) return "today"; if(n.due<=weekEndStr()) return "week"; return "later"; }
    if(n.repeat){
      if(n.repeat==="daily") return "today";
      if(n.repeat==="weekly"){ const wds=wdays(n); if(!wds.length) return "week"; return wds.includes(new Date().getDay())?"today":"week"; }
      const td=recurDate(n); // monthly
      if(td){ const s=ymd(td); if(s<today) return isDone(n)?"today":"later"; if(s===today) return "today"; if(s<=weekEndStr()) return "week"; return "later"; }
      return "later";
    }
    return "none"; }
  function branchColor(b){ return (b&&b.color)?b.color:getComputedStyle(document.documentElement).getPropertyValue("--accent").trim(); }

  function taskRowHtml(t){
    const n=t.node, col=branchColor(t.branch), done=isDone(n);
    const chips=[];
    if(n.priority) chips.push(`<span class="meta-flag">${ICON.flag}</span>`);
    if(n.repeat) chips.push(`<span class="chip cadence-chip" style="--col:${col}">${repeatLabel(n)}</span>`);
    if(n.due){ const dl=dueLabel(n.due); if(dl) chips.push(`<span class="chip due-chip ${dl.cls}">${dl.text}</span>`); }
    if(n.link) chips.push(`<a class="chip link-chip" href="${esc(n.link)}" target="_blank" rel="noopener noreferrer" data-role="link" title="${esc(n.link)}">${ICON.link}リンク</a>`);
    const sub=(t.path&&t.path.length>1)?`<span class="db-path">${esc(t.path.slice(1).join(" › "))}</span>`:"";
    const subline=(sub||chips.length)?`<div class="dash-sub">${sub}${chips.join("")}</div>`:"";
    return `<div class="dash-task ${done?"done":""}" data-id="${n.id}" style="--dc:${col}">
      <button class="dash-check" data-role="check">${ICON.check}</button>

  }
  function sectionHtml(title,list,color,emptyMsg,extraClass){
    if(!list.length&&!emptyMsg) return "";

    return `<div class="dash-section ${extraClass||""}">
      <div class="dash-h"><span class="dot" style="background:${color}"></span><h3>${title}</h3><span class="cnt">残り${rem}</span></div>
      <div class="dash-card">${body}</div></div>`;
  }
  function renderDash(){
    const tasks=collectTasks();
    const B={overdue:[],today:[],week:[],later:[],none:[],done:[]};
    tasks.forEach(t=>{ B[bucketOf(t)].push(t); });
    const order=(a,b)=>{ const da=isDone(a.node)?1:0, db=isDone(b.node)?1:0; if(da!==db) return da-db;
      const pa=a.node.priority?0:1, pb=b.node.priority?0:1; if(pa!==pb) return pa-pb;
      const x=a.node.due||"9999", y=b.node.due||"9999"; return x<y?-1:x>y?1:0; };
    B.overdue.sort(order); B.today.sort(order); B.week.sort(order);
    const priNone=B.none.filter(t=>t.node.priority).sort(order);
    const rem=(l)=>l.filter(t=>!isDone(t.node)).length;
    const total=tasks.length, done=tasks.filter(t=>isDone(t.node)).length;
    const todayN=rem(B.overdue)+rem(B.today), weekN=rem(B.week);
    const priN=tasks.filter(t=>t.node.priority&&!isDone(t.node)).length;
    const now=new Date(); const dateline=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${WD[now.getDay()]}）`;

    const muted=getComputedStyle(document.documentElement).getPropertyValue("--muted").trim();

    let html=`<div class="dash-inner">
      <div class="dash-date">${dateline}</div>
      <h1 class="dash-title">今日やること</h1>
      <div class="stat-row">
        <div class="stat accent"><div class="num">${todayN}</div><div class="lbl">今日やること</div></div>
        <div class="stat"><div class="num">${weekN}</div><div class="lbl">今週やること</div></div>
        <div class="stat flag"><div class="num">${priN}</div><div class="lbl">優先（未完了）</div></div>

      </div>`;

    if(!total){ html+=`<div class="dash-blank"><h2>タスクがまだありません</h2><p>「マインドマップ」でタスクを追加すると、ここに今日・今週やることが集まります。</p></div></div>`; dash.innerHTML=html; return; }

    function timeGroup(title,list,color){
      const remaining=list.filter(t=>!isDone(t.node)).length;
      let inner="";
      if(!list.length){ inner=`<div class="dash-empty">タスクはありません。</div>`; }
      else {
        const byB=new Map();
        list.forEach(t=>{ const k=t.branch?t.branch.id:"_"; if(!byB.has(k)) byB.set(k,{branch:t.branch,items:[]}); byB.get(k).items.push(t); });
        const groups=[...byB.values()].sort((a,b)=>state.root.children.indexOf(a.branch)-state.root.children.indexOf(b.branch));
        groups.forEach(g=>{
          const col=branchColor(g.branch);
          const rec=g.items.filter(t=>t.node.repeat).sort(order);
          const spot=g.items.filter(t=>!t.node.repeat).sort(order);
          let s="";
          if(rec.length) s+=`<div class="db-sub">${ICON.repeat}<span>定例タスク</span></div>`+rec.map(taskRowHtml).join("");
          if(spot.length) s+=`<div class="db-sub"><span>そのときのタスク</span></div>`+spot.map(taskRowHtml).join("");
          inner+=`<div class="db-branch"><div class="db-bhead"><span class="bdot" style="background:${col}"></span>${esc(g.branch?(g.branch.text||"項目"):"項目")}</div>${s}</div>`;
        });
      }
      return `<div class="dash-section"><div class="dash-h"><span class="dot" style="background:${color}"></span><h3>${title}</h3><span class="cnt">残り${remaining}</span></div><div class="dash-card db-card">${inner}</div></div>`;
    }

    html+=timeGroup("今日のタスク",B.overdue.concat(B.today),accent);
    html+=timeGroup("今週のタスク",B.week,"#4C6EF5");

  dash.addEventListener("click",(e)=>{

  function countTasksIn(node){ let dn=0,tn=0; (function w(n){ n.children.forEach(k=>{ if(k.type==="task"){ tn++; if(isDone(k)) dn++; } w(k); }); })(node); return {done:dn,total:tn}; }
  function olRow(node,depth,col){
    const pad=10+depth*20;

  function renderTasks(){
    const accent=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();

    if(!state.root.children.length){ html+=`<div class="dash-blank"><h2>まだ項目がありません</h2><p>「マインドマップ」で項目を追加すると、ここに階層つきのタスク一覧が出ます。</p></div></div>`; tasksView.innerHTML=html; return; }

  const clToken=()=>localStorage.getItem(CL_TOKEN);

  async function clApi(path,opts){ opts=opts||{}; const headers={"Content-Type":"application/json"}; const t=clToken(); if(t) headers["Authorization"]="Bearer "+t;
    const fo={method:opts.method||"GET",headers}; if(opts.body) fo.body=JSON.stringify(opts.body);

  let pushTimer=null, pushing=false;
  cloudPush=function(){ if(!clLoggedIn()) return; clearTimeout(pushTimer);
    pushTimer=setTimeout(async()=>{ if(pushing) return; pushing=true; try{ await clUpload(); }catch(e){} pushing=false; },2000); };

  let clMode="login";
  function renderCloud(){
    const body=$("#cloud-body");
    if(clLoggedIn()){
      const at=localStorage.getItem(CL_AT);
      body.innerHTML=`<div class="cl-status"><span class="dotstate" style="width:9px;height:9px;border-radius:50%;background:var(--accent)"></span><span class="em">${esc(clEmail()||"")}</span></div>
        <div class="cl-meta">最終同期: ${at?esc(new Date(at).toLocaleString("ja-JP")):"—"}</div>
        <div class="cl-actions"><button class="btn primary" id="cl-syncnow">今すぐ同期</button><button class="btn" id="cl-logout">ログアウト</button></div>
        <div class="cl-err" id="cl-err"></div>
        <div class="cl-note">変更は自動でクラウドに保存され、別の端末で開くと最新が読み込まれます。<br><b>注意:</b> Dayce本体とは<b>別のメール</b>で使ってください（データが混ざらないように）。</div>`;
      $("#cl-syncnow").onclick=async()=>{ const e=$("#cl-err"); e.textContent=""; try{ await clUpload(); await clDownload(); reloadFromStorage(); renderCloud(); toast("同期しました"); }catch(err){ e.textContent=err.message; } };
      $("#cl-logout").onclick=()=>{ clLogout(); setCloudBtn(); renderCloud(); };
    } else {
      const reg=(clMode==="register");
      body.innerHTML=`<div class="cl-field"><label>メールアドレス</label><input id="cl-email" type="email" autocomplete="username" placeholder="you@example.com"></div>
        <div class="cl-field"><label>パスワード</label><input id="cl-pw" type="password" autocomplete="${reg?"new-password":"current-password"}" placeholder="${reg?"8文字以上":""}"></div>
        <div class="cl-actions"><button class="btn primary" id="cl-submit">${reg?"新規登録":"ログイン"}</button></div>
        <div class="cl-err" id="cl-err"></div>
        <div class="cl-switch">${reg?"アカウントをお持ちですか？ <a id='cl-toggle'>ログイン</a>":"はじめてですか？ <a id='cl-toggle'>新規登録</a>"}</div>
        <div class="cl-note">Dayceのクラウド（api.dayce.app）を使います。<b>Dayce本体とは別のメール</b>で登録してください。<br>このページを<b>Webサイトに設置</b>すると、複数端末で同じデータになります。</div>`;
      $("#cl-toggle").onclick=()=>{ clMode=reg?"login":"register"; renderCloud(); };
      $("#cl-submit").onclick=async()=>{ const e=$("#cl-err"); e.textContent="";
        const email=($("#cl-email").value||"").trim(), pw=$("#cl-pw").value||"";
        if(!email||!pw){ e.textContent="メールとパスワードを入力してください"; return; }
        try{ if(reg) await clRegister(email,pw); else await clLogin(email,pw);
          const got=await clDownload(); if(got){ reloadFromStorage(); } else { await clUpload(); }
          setCloudBtn(); renderCloud(); toast(reg?"登録して同期を開始しました":"ログインしました");
        }catch(err){ e.textContent=err.message; } };
    }
  }
  function openCloud(){ $("#cloud-modal").hidden=false; renderCloud(); }
  function closeCloud(){ $("#cloud-modal").hidden=true; }
  $("#btn-cloud").addEventListener("click",openCloud);
  $("#cloud-close").addEventListener("click",closeCloud);
  $("#cloud-modal").addEventListener("click",(e)=>{ if(e.target===$("#cloud-modal")) closeCloud(); });

  render();
  setCloudBtn();
  if(clLoggedIn()){ clDownload().then(got=>{ if(got) reloadFromStorage(); }).catch(()=>{}); }
})();
</script>
